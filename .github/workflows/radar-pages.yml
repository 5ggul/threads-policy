name: money-hunt-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radar/build.py'
      - '.github/workflows/radar-pages.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: money-hunt-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build MONEY HUNT
        run: python radar/build.py

      - name: Quality gate
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          d=json.load(open('radar/data.json',encoding='utf-8'))
          rows=d['items']
          blocked=['싱글벙글','ㅋㅋ','특징주','목표주가','투자의견','상한가','급등주',
                   '리딩방','수익 보장','원금 보장','일본 대기업','日대기업','직원 부업 허용']
          assert 5 <= len(rows) <= 27, len(rows)
          assert len({x['id'] for x in rows}) == len(rows)
          assert len({x['headline'].strip().lower() for x in rows}) == len(rows)
          assert all(x['score'] >= 69 for x in rows)
          assert all(x['source_count'] >= 1 and x['sources'] for x in rows)
          assert all(x['why_now'] and x['angle'] and x['check_first'] for x in rows)
          assert not [x['headline'] for x in rows if any(b.lower() in x['headline'].lower() for b in blocked)]
          per_topic=Counter(x['topic_id'] for x in rows)
          assert max(per_topic.values(), default=0) <= 1, per_topic
          assert d['counts'].get('부업',0) >= 2, d['counts']
          print('MONEY_HUNT_QUALITY_PASS', d['counts'], d['meta'])
          for x in rows:
              print(f"[{x['lane']}] {x['status']} {x['score']} {x['headline']} / {x['source_count']} sources")
          PY

      - name: Commit generated snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+5ggul@users.noreply.github.com
          git add radar/index.html radar/data.json
          git diff --cached --quiet || git commit -m 'data: refresh MONEY HUNT'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
