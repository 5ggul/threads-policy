<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지원 페이지</title>
  <style>
    :root { color-scheme: light; --bg:#f6f7fb; --card:#ffffff; --text:#1d2433; --muted:#5c677d; --line:#d7ddea; --accent:#1a73e8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Segoe UI, Arial, sans-serif; background:linear-gradient(180deg,#eef3ff 0%,var(--bg) 100%); color:var(--text); }
    .wrap { max-width:760px; margin:0 auto; padding:48px 20px 64px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px; box-shadow:0 10px 30px rgba(20,34,66,.06); }
    h1 { margin:0 0 10px; font-size:32px; }
    p { line-height:1.7; color:var(--muted); }
    ul { padding-left:18px; line-height:1.8; color:var(--muted); }
    a { color:var(--accent); text-decoration:none; }
    nav a { display:block; padding:14px 0; border-top:1px solid var(--line); }
    nav a:first-child { border-top:0; }
    .meta { margin-top:24px; font-size:14px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>앱 정책 안내</h1>
      <p>이 페이지는 Threads API 연동 앱의 정책 안내용 페이지입니다.</p>
      <nav>
        <a href="/privacy.html">개인정보처리방침</a>
        <a href="/terms.html">서비스 이용약관</a>
        <a href="/data-deletion.html">데이터 삭제 안내</a>
      </nav>
      <div class="meta">최종 업데이트: 2026-03-11</div>
    </div>
  </div>
</body>
</html>
