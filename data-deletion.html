<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>데이터 삭제 안내</title>
  <style>
    body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f7f8fc;color:#1f2937}
    .wrap{max-width:760px;margin:0 auto;padding:40px 20px 60px}.card{background:#fff;border:1px solid #dde3ef;border-radius:16px;padding:28px}
    h1,h2{margin-top:0} p,li{line-height:1.75;color:#4b5563} a{color:#1a73e8;text-decoration:none}
    .box{padding:14px 16px;border-radius:12px;background:#eef4ff;border:1px solid #cddcfb}
  </style>
</head>
<body>
  <div class="wrap"><div class="card">
    <h1>데이터 삭제 안내</h1>
    <p>앱에 저장된 설정 또는 연동 데이터를 삭제하려면 아래 절차를 따라 주세요.</p>
    <div class="box">
      <strong>삭제 요청 방법</strong>
      <p>앱 운영자에게 삭제 요청을 보내면 확인 후 저장된 연동 정보와 게시 설정 데이터를 삭제합니다.</p>
    </div>
    <h2>삭제 대상</h2>
    <ul>
      <li>Threads 사용자 ID</li>
      <li>액세스 토큰 정보</li>
      <li>앱 내부 게시 예약 데이터</li>
    </ul>
    <h2>처리 기간</h2>
    <p>일반적으로 요청 확인 후 합리적인 기간 내에 삭제 처리합니다.</p>
    <p><a href="/index.html">메인으로</a></p>
  </div></div>
</body>
</html>
