  <style>
    body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f7f8fc;color:#1f2937}
    .wrap{max-width:760px;margin:0 auto;padding:40px 20px 60px}.card{background:#fff;border:1px solid #dde3ef;border-radius:16px;padding:28px}

<body>
  <div class="wrap"><div class="card">
    <h1>서비스 이용약관</h1>
    <p>본 앱은 사용자가 Threads 계정에 게시물을 작성하거나 예약 발행할 수 있도록 돕는 도구입니다.</p>

      <li>Threads API를 통한 게시물 작성</li>
      <li>예약 발행 및 상태 확인</li>
    </ul>

    <ul>
      <li>사용자는 본인이 업로드하는 게시물 내용에 대한 책임을 집니다.</li>
      <li>사용자는 관련 플랫폼 정책과 법률을 준수해야 합니다.</li>
    </ul>
    <h2>3. 서비스 변경</h2>
    <p>운영자는 필요 시 서비스 내용을 변경하거나 중단할 수 있습니다.</p>
    <h2>4. 문의</h2>
    <p>운영 관련 문의는 앱 운영자에게 전달해 주세요.</p>
